[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "culsen-bn"
version = "0.1.0"
description = "An Uncertainty-Aware, Culture-Sensitive Contrastive Learning Framework for Robust Bengali Sentiment Analysis Across Music Seasons"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ragib Hasan", email = "ragib@example.com"}
]
keywords = [
    "bengali-nlp",
    "sentiment-analysis",
    "uncertainty-learning",
    "contrastive-learning",
    "domain-generalization",
    "coke-studio-bangla"
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.19.0",
    "datasets>=2.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "accelerate>=0.21.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
